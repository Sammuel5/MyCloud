<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" fill="none">
  <defs>
    <linearGradient id="brand" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset=".55" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="headline" x1="72" y1="300" x2="620" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7dd3fc"/>
      <stop offset=".5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="topline" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset=".35" stop-color="#38bdf8" stop-opacity=".8"/>
      <stop offset=".65" stop-color="#7c3aed" stop-opacity=".8"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="window" x1="730" y1="118" x2="1208" y2="542" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111c33"/>
      <stop offset="1" stop-color="#0a1122"/>
    </linearGradient>
    <linearGradient id="thumb1" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="thumb2" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="thumb3" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="progress" x1="842" y1="0" x2="1052" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset=".55" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#94a3b8" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowSky" cx="0" cy="0" r="1" gradientTransform="translate(210 130) rotate(35) scale(430)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0ea5e9" stop-opacity=".38"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowIndigo" cx="0" cy="0" r="1" gradientTransform="translate(980 330) rotate(20) scale(470)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4f46e5" stop-opacity=".4"/>
      <stop offset="1" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0" cy="0" r="1" gradientTransform="translate(1160 610) rotate(-30) scale(380)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7c3aed" stop-opacity=".34"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <filter id="cardShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#020617" flood-opacity=".7"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="#070b16"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glowSky)"/>
  <rect width="1280" height="640" fill="url(#glowIndigo)"/>
  <rect width="1280" height="640" fill="url(#glowViolet)"/>
  <rect width="1280" height="2" fill="url(#topline)"/>

  <!-- Brand lockup -->
  <g>
    <rect x="72" y="58" width="64" height="64" rx="16" fill="url(#brand)"/>
    <path d="M92 100V88.8c0-2.1 1.7-3.8 3.8-3.8h5.1l3.2 3.8h10.1c2.1 0 3.8 1.7 3.8 3.8v7.4c0 2.1-1.7 3.8-3.8 3.8H95.8c-2.1 0-3.8-1.7-3.8-3.8Z" fill="#fff" fill-opacity=".95"/>
    <path d="M100 90v-3.2c0-3.4 2.8-6.2 6.2-6.2s6.2 2.8 6.2 6.2V90" stroke="#fff" stroke-opacity=".8" stroke-width="3.2" stroke-linecap="round"/>
    <text x="152" y="92" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="-.4" fill="#f8fafc">MyCloud</text>
    <text x="153" y="114" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="9.5" font-weight="600" letter-spacing="2.8" fill="#7dd3fc" fill-opacity=".85">SELF-HOSTED PERSONAL CLOUD</text>
  </g>

  <!-- Headline -->
  <text x="72" y="250" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="-2.4" fill="#f8fafc">Your own</text>
  <text x="72" y="320" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="-2.4" fill="url(#headline)">private cloud.</text>
  <text x="72" y="374" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20.5" font-weight="400" fill="#d7e2f2">A self-hosted drive for Windows that keeps every file</text>
  <text x="72" y="402" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20.5" font-weight="400" fill="#d7e2f2">on your own disk &#8212; no subscriptions, no third-party cloud.</text>
  <text x="72" y="438" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#8fa3c0">Resumable uploads &#183; Photo &amp; video previews &#183; Sharing links &#183; Role-based admin</text>

  <!-- Feature pills -->
  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="600">
    <rect x="72" y="462" width="145" height="36" rx="18" fill="#94a3b8" fill-opacity=".07" stroke="#94a3b8" stroke-opacity=".18"/>
    <circle cx="92" cy="480" r="3" fill="#38bdf8"/>
    <text x="102" y="484.5" fill="#cbd5e1">100% self-hosted</text>

    <rect x="229" y="462" width="164" height="36" rx="18" fill="#94a3b8" fill-opacity=".07" stroke="#94a3b8" stroke-opacity=".18"/>
    <circle cx="249" cy="480" r="3" fill="#818cf8"/>
    <text x="259" y="484.5" fill="#cbd5e1">Windows + MongoDB</text>

    <rect x="405" y="462" width="139" height="36" rx="18" fill="#94a3b8" fill-opacity=".07" stroke="#94a3b8" stroke-opacity=".18"/>
    <circle cx="425" cy="480" r="3" fill="#c084fc"/>
    <text x="435" y="484.5" fill="#cbd5e1">Tailscale ready</text>
  </g>

  <!-- Attribution -->
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <circle cx="89" cy="580" r="17" fill="url(#brand)"/>
    <text x="89" y="584.5" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">SB</text>
    <text x="117" y="575" font-size="9.5" font-weight="600" letter-spacing="1.4" fill="#64748b">CREATED BY</text>
    <text x="117" y="593" font-size="13.5" font-weight="600" fill="#cbd5e1">Sammuel Barrientos</text>
  </g>

  <!-- Decorative dot grid -->
  <g fill="#64748b" fill-opacity=".28">
    <circle cx="1216" cy="70" r="1.6"/><circle cx="1234" cy="70" r="1.6"/><circle cx="1252" cy="70" r="1.6"/>
    <circle cx="1216" cy="88" r="1.6"/><circle cx="1234" cy="88" r="1.6"/><circle cx="1252" cy="88" r="1.6"/>
    <circle cx="1216" cy="106" r="1.6"/><circle cx="1234" cy="106" r="1.6"/><circle cx="1252" cy="106" r="1.6"/>
  </g>

  <!-- Glow behind app preview -->
  <ellipse cx="990" cy="400" rx="290" ry="190" fill="#4f46e5" fill-opacity=".16" filter="url(#softBlur)"/>

  <!-- App window preview -->
  <g filter="url(#cardShadow)">
    <rect x="730" y="118" width="478" height="424" rx="16" fill="url(#window)" stroke="#24324d" stroke-width="1.2"/>
    <!-- Title bar -->
    <path d="M746 118h446a16 16 0 0 1 16 16v28H730v-28a16 16 0 0 1 16-16Z" fill="#0b1322"/>
    <circle cx="752" cy="140" r="4.2" fill="#f87171"/>
    <circle cx="770" cy="140" r="4.2" fill="#fbbf24"/>
    <circle cx="788" cy="140" r="4.2" fill="#34d399"/>
    <rect x="830" y="129" width="278" height="22" rx="7" fill="#070d18" stroke="#1c2942"/>
    <path d="M844 143.5a3.5 3.5 0 1 0 0-.1" stroke="#64748b" stroke-width="1.2"/>
    <line x1="847.5" y1="143.5" x2="850.5" y2="146.5" stroke="#64748b" stroke-width="1.2" stroke-linecap="round"/>
    <text x="858" y="144" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="9" fill="#64748b">mycloud.local/drive</text>

    <!-- Sidebar -->
    <path d="M730 162h92v364a16 16 0 0 1-16 16h-60a16 16 0 0 1-16-16V162Z" fill="#080e1b"/>
    <rect x="742" y="178" width="68" height="30" rx="8" fill="#4f46e5" fill-opacity=".18" stroke="#6366f1" stroke-opacity=".35"/>
    <path d="M755 188.5 760 184l5 4.5v6h-3.5v-4h-3v4H755v-6Z" fill="#a5b4fc"/>
    <rect x="768" y="186" width="28" height="3" rx="1.5" fill="#a5b4fc" fill-opacity=".75"/>
    <rect x="768" y="194" width="18" height="2.5" rx="1.25" fill="#a5b4fc" fill-opacity=".35"/>

    <g stroke="#4b5d7a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M755 234h7l2 2h6v8h-15v-10Z"/>
      <rect x="754" y="262" width="10" height="10" rx="2"/>
      <path d="M762 274l-3 4-4-4"/>
      <path d="M756 306l3.5 2.1 3.5-2.1v-4.2L759.5 300 756 302v4Z"/>
      <path d="M755 330h9M755 335h6"/>
    </g>

    <!-- Main content -->
    <text x="842" y="191" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">My Drive</text>
    <rect x="1052" y="173" width="136" height="24" rx="7" fill="#070d18" stroke="#1c2942"/>
    <circle cx="1064" cy="185" r="3.5" stroke="#64748b" stroke-width="1.1"/>
    <line x1="1066.5" y1="187.5" x2="1069" y2="190" stroke="#64748b" stroke-width="1.1" stroke-linecap="round"/>
    <text x="1076" y="188" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="8.5" fill="#64748b">Search files</text>
    <circle cx="1172" cy="185" r="9" fill="url(#brand)"/>
    <text x="1172" y="188" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="7.5" font-weight="700" fill="#fff" text-anchor="middle">SB</text>

    <!-- Folder cards -->
    <text x="842" y="221" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="8" font-weight="600" letter-spacing="1.2" fill="#64748b">FOLDERS</text>
    <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="8.5" fill="#cbd5e1">
      <rect x="842" y="231" width="116" height="62" rx="9" fill="#0f1a2e" stroke="#22314d"/>
      <path d="M852 244h8l2.2 2.4h8v10h-18.2v-12.4Z" fill="#38bdf8" fill-opacity=".85"/>
      <text x="852" y="280">Documents</text>

      <rect x="970" y="231" width="116" height="62" rx="9" fill="#0f1a2e" stroke="#22314d"/>
      <path d="M980 244h8l2.2 2.4h8v10h-18.2v-12.4Z" fill="#818cf8" fill-opacity=".85"/>
      <text x="980" y="280">Photos</text>

      <rect x="1098" y="231" width="90" height="62" rx="9" fill="#0f1a2e" stroke="#22314d"/>
      <path d="M1108 244h8l2.2 2.4h8v10h-18.2v-12.4Z" fill="#c084fc" fill-opacity=".85"/>
      <text x="1108" y="280">Archive</text>
    </g>

    <!-- File cards -->
    <text x="842" y="321" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="8" font-weight="600" letter-spacing="1.2" fill="#64748b">FILES</text>
    <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="8.5" fill="#cbd5e1">
      <rect x="842" y="331" width="116" height="84" rx="9" fill="#0f1a2e" stroke="#22314d"/>
      <rect x="848" y="337" width="104" height="58" rx="6" fill="url(#thumb1)"/>
      <circle cx="930" cy="350" r="5" fill="#fef3c7" fill-opacity=".9"/>
      <path d="M848 385l26-22 20 16 16-12 42 31v3a6 6 0 0 1-6 6H854a6 6 0 0 1-6-6v-16Z" fill="#0f172a" fill-opacity=".35"/>
      <text x="848" y="410">sunset.jpg</text>

      <rect x="970" y="331" width="116" height="84" rx="9" fill="#0f1a2e" stroke="#22314d"/>
      <rect x="976" y="337" width="104" height="58" rx="6" fill="url(#thumb2)"/>
      <circle cx="1028" cy="366" r="13" fill="#0b1221" fill-opacity=".45"/>
      <path d="M1025 359.5v13l10-6.5-10-6.5Z" fill="#fff" fill-opacity=".95"/>
      <text x="976" y="410">trip.mp4</text>

      <rect x="1098" y="331" width="90" height="84" rx="9" fill="#0f1a2e" stroke="#22314d"/>
      <rect x="1104" y="337" width="78" height="58" rx="6" fill="url(#thumb3)"/>
      <rect x="1121" y="348" width="44" height="36" rx="4" fill="#f8fafc"/>
      <path d="M1130 358h26M1130 365h26M1130 372h18" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
      <text x="1104" y="410">report.pdf</text>
    </g>

    <!-- Storage -->
    <text x="842" y="468" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="8.5" fill="#94a3b8">Storage</text>
    <text x="1188" y="468" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="8.5" fill="#64748b" text-anchor="end">12.4 GB of 50 GB</text>
    <rect x="842" y="478" width="346" height="7" rx="3.5" fill="#172033"/>
    <rect x="842" y="478" width="210" height="7" rx="3.5" fill="url(#progress)"/>

    <!-- Uploading toast -->
    <rect x="898" y="500" width="278" height="30" rx="9" fill="#0b1628" stroke="#24324d"/>
    <circle cx="916" cy="515" r="7" fill="#34d399" fill-opacity=".16"/>
    <path d="M912.5 515l2.4 2.4 4.6-4.8" stroke="#34d399" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="932" y="518" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="8.5" fill="#cbd5e1">Upload complete &#183; 4 files verified</text>
  </g>

  <!-- Floating accents -->
  <circle cx="1180" cy="92" r="4" fill="#38bdf8" fill-opacity=".8"/>
  <circle cx="708" cy="545" r="3" fill="#a855f7" fill-opacity=".7"/>
</svg>
